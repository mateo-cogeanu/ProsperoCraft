    <linearGradient id="grass"><stop stop-color="#a5e1a2"/><stop offset="1" stop-color="#5ba783"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="308" rx="24" fill="url(#background)" stroke="#2b483b"/>
  <path d="M920 0v310M1000 0v310M1080 0v310M1160 0v310M870 75h330M870 155h330M870 235h330" stroke="#1c3328"/>
  <g stroke="#b2dfb9" stroke-width="1.5" stroke-linejoin="round">
    <path d="M1010 107l70-39 70 39-70 40z" fill="url(#grass)"/>
    <path d="M1010 107l70 40v82l-70-40z" fill="#395845"/>
