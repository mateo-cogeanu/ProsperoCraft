    <text x="69" y="63" font-size="15" font-weight="600" letter-spacing="3" fill="#b0ccb9">JAVA EDITION · NATIVE PS5 HOMEBREW</text>
    <text x="48" y="142" font-size="65" font-weight="700" letter-spacing="-2" fill="#f1f7f2">Prospero<tspan fill="#a5dfb5">Craft</tspan></text>
    <text x="51" y="182" font-size="21" fill="#b3ccbc">Minecraft Java on PS5. Instances, accounts and mods.</text>
    <rect x="50" y="225" width="230" height="35" rx="17" fill="#243e30" stroke="#3d634c"/>
    <text x="72" y="247" font-size="14" font-weight="600" fill="#bbdfc1">NATIVE JAVA 25</text>
