<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title description">
  <title id="title">ProsperoCraft: Minecraft Java on PS5</title>
  <desc id="description">Minecraft Java Edition on PS5 through a Native Java 25 Runtime. Instances, accounts and mods; game and loader compatibility varies. See the README for console validation limits.</desc>
