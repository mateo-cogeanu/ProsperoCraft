name: Bug report
description: Report a crash, freeze or something that does not work in ProsperoCraft.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a mod or shader pack that does not work, please use the mod or shader template instead.
  - type: input
    id: build
    attributes:
      label: ProsperoCraft build
      description: Shown in the launcher footer.
      placeholder: 01.000.117
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installed from
      options:
        - ProsperoStore
        - GitHub release ZIP
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Launcher or menus
        - Login or account
        - Downloads or instances
        - Game startup
        - Gameplay or performance
        - Controls or vibration
        - Audio
        - Saves or worlds
        - Multiplayer or LAN
        - Mods or content manager
        - Other
    validations:
      required: true
  - type: input
    id: instance
    attributes:
      label: Instance version and loader
      placeholder: 26.3 Vanilla
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Installed mods, shaders and resource packs
      placeholder: none
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the instance
        2. Join a world
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include screenshots or a video if you can.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      description: |
        Keep original reports local. Review and redact them before sharing a minimal excerpt: remove access/refresh tokens, device codes, authorization headers, account-store keys, personal paths and other personal data. Never attach raw report bundles or account/session/key files. For suspected vulnerabilities use the private reporting link in SECURITY.md, not a public issue.

        Over FTP, copy `/download0/probe-native-stderr.log`, `/download0/java25-exceptions.log` and `/download0/probe-session.txt`, plus the instance's `logs/latest.log` and any `crash-reports/` file. Collect them right after the problem, before reopening the app. With ProsperoCraft open, you can also download the reports from `http://<PS5-IP>:8765/`; the HTTP filenames are aliases for these files.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed access/refresh credentials, device codes, account-store keys, account/session files and other personal info from anything I attached.
          required: true
