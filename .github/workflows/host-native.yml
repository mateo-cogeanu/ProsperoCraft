name: Optional host native
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Check hosted native toolchain
        run: |
          clang --version
          clang++ --version
          uname -sm
      - name: Scoped native code, ASan/UBSan and JNI loading
        env:
          PROSPERO_HOST_DEPS: ${{ runner.temp }}/prospero-host-deps
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tools/run_host_tests.py --lane native --fetch-deps
